components:
  schemas:
    dto.AuthorResponse:
      properties:
        bio:
          example: i am author
          type: string
        category:
          example: Cars
          type: string
      type: object
    dto.LoginRequest:
      properties:
        login:
          description: Email или username пользователя
          example: username123
          type: string
        password:
          example: secret_password_123
          type: string
      type: object
    dto.PostResponse:
      properties:
        body:
          example: smth in body
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
        published_at:
          example: "2026-09-01T12:00:00Z"
          type: string
        status:
          example: published
          type: string
        title:
          example: my title
          type: string
      type: object
    dto.ProfilePostsResponse:
      properties:
        posts:
          items:
            $ref: '#/components/schemas/dto.PostResponse'
          type: array
          uniqueItems: false
        user_id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
      type: object
    dto.ProfileResponse:
      properties:
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
        user:
          $ref: '#/components/schemas/dto.ProfileUserResponse'
      type: object
    dto.ProfileUserResponse:
      properties:
        avatar_key:
          example: avatars/user-1.png
          type: string
        created_at:
          example: "2026-08-01T12:00:00Z"
          type: string
        email:
          example: user@example.com
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.RegistrationRequest:
      properties:
        email:
          example: user@example.com
          type: string
        nickname:
          example: nickname_123
          type: string
        password:
          example: secret_password_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.UserResponse:
      properties:
        email:
          example: user@example.com
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    response.ErrorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    CookieAuth:
      in: cookie
      name: token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: Регистрация, вход, выход и профиль пользователя.
  title: Patreon Clone API
  version: "1.0"
openapi: 3.1.0
paths:
  /login:
    post:
      description: Принимает учетные данные, проверяет их и выпускает токен
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.LoginRequest'
              description: Учетные данные пользователя
              summary: request
        description: Учетные данные пользователя
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.UserResponse'
          description: Успешная аутентификация
          headers:
            Set-Cookie:
              description: token=JWT_TOKEN; Path=/; HttpOnly; SameSite=Lax
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный логин или пароль
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Аутентификация пользователя
      tags:
      - auth
  /logout:
    post:
      description: Удаляет авторизационную cookie с токеном
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Успешный выход из системы
          headers:
            Set-Cookie:
              description: token=; Path=/; Max-Age=-1
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Деавторизация пользователя
      tags:
      - auth
  /profile/me:
    get:
      description: Возвращает данные пользователя и информацию о том, является ли
        он автором
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ProfileResponse'
          description: Профиль пользователя
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не найден
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Получение профиля текущего пользователя
      tags:
      - profile
  /profile/me/posts:
    get:
      description: Возвращает посты текущего пользователя; если постов нет, возвращает
        пустой список
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ProfilePostsResponse'
          description: Посты пользователя
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Получение постов текущего пользователя
      tags:
      - profile
  /signup:
    post:
      description: Принимает регистрационные данные, валидирует и создает новый аккаунт
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.RegistrationRequest'
              description: Данные нового пользователя
              summary: request
        description: Данные нового пользователя
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.UserResponse'
          description: Пользователь успешно зарегистрирован
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: 'Ошибка регистрации: пользователь с таким email / username
            уже существует'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Регистрация пользователя
      tags:
      - auth
