components:
  schemas:
    dto.CreateDonationRequest:
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
        is_anonymous:
          type: boolean
        message:
          type: string
        request_key:
          type: string
      type: object
    dto.CreateDonationResponse:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    dto.CreateSubscriptionRequest:
      properties:
        action:
          type: string
        expected_current_tier_id:
          type: string
        expected_price_minor:
          type: integer
        expected_subscription_id:
          type: string
        post_id:
          type: string
        request_key:
          type: string
        tier_id:
          type: string
      type: object
    dto.CreateSubscriptionResponse:
      properties:
        current_subscription:
          $ref: '#/components/schemas/dto.CurrentSubscription'
      type: object
    dto.CreateSubscriptionTierRequest:
      properties:
        description:
          type: string
        name:
          type: string
        price_minor:
          type: integer
      type: object
    dto.CurrentSubscription:
      properties:
        currency:
          type: string
        id:
          type: string
        period_ends_at:
          type: string
        price_minor:
          type: integer
        tier:
          $ref: '#/components/schemas/dto.SubscriptionTierReference'
      type: object
    dto.DonationPageResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/dto.GetDonationResponse'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    dto.DonationUserInfo:
      properties:
        avatar_url:
          type: string
        nickname:
          type: string
        username:
          type: string
      type: object
    dto.GetDonationResponse:
      properties:
        amount_minor:
          type: integer
        created_at:
          type: string
        currency:
          type: string
        id:
          type: string
        is_anonymous:
          type: boolean
        message:
          type: string
        status:
          type: string
        user:
          $ref: '#/components/schemas/dto.DonationUserInfo'
      type: object
    dto.SubscriptionOptionsResponse:
      properties:
        current_subscription:
          $ref: '#/components/schemas/dto.CurrentSubscription'
        items:
          items:
            $ref: '#/components/schemas/dto.SubscriptionTier'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    dto.SubscriptionTier:
      properties:
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        price_minor:
          type: integer
        status:
          type: string
      type: object
    dto.SubscriptionTierListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/dto.SubscriptionTier'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    dto.SubscriptionTierReference:
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
      type: object
    dto.UpdateSubscriptionTierRequest:
      properties:
        description:
          type: string
        name:
          type: string
        price_minor:
          type: integer
        status:
          type: string
      type: object
    response.ErrorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    CookieAuth:
      in: cookie
      name: __Host-token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: API монетизации. Сейчас доступны создание донатов с оплатой и просмотр
    истории донатов.
  title: Patreon Clone Monetization API
  version: "1.0"
openapi: 3.1.0
paths:
  /authors/{author_id}/donations:
    post:
      description: Создаёт донат, платёжный заказ и начальную попытку в одной транзакции,
        затем выполняет оплату через провайдера. Возвращает ID и актуальный статус
        заказа.
      parameters:
      - description: ID автора
        in: path
        name: author_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.CreateDonationRequest'
              description: Данные доната
              summary: request
        description: Данные доната
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CreateDonationResponse'
          description: Донат создан, возвращён статус оплаты
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации или некорректный ID автора
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Автор не найден
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Конфликт оплаты
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Отправка доната
      tags:
      - donations
  /authors/{author_id}/subscription-options:
    get:
      description: Возвращает текущую подписку читателя и доступные для оформления
        уровни страницами по возрастанию цены и ID. Для следующей страницы передайте
        next_cursor из ответа в параметр cursor. Персональный ответ не кэшируется.
      parameters:
      - description: ID автора
        in: path
        name: author_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Ограничить уровнями, открывающими этот пост
        in: query
        name: post_id
        schema:
          format: uuid
          type: string
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.SubscriptionOptionsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      summary: Варианты подписки автора
      tags:
      - subscriptions
  /authors/{author_id}/subscriptions:
    post:
      description: Создаёт платёжный заказ и выполняет попытку оплаты выбранного уровня.
        Повтор request_key возвращает результат исходного действия.
      parameters:
      - description: ID автора
        in: path
        name: author_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.CreateSubscriptionRequest'
              description: Параметры подписки
              summary: request
        description: Параметры подписки
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CreateSubscriptionResponse'
          description: Повышение уровня
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CreateSubscriptionResponse'
          description: Оформление подписки
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - CookieAuth: []
      summary: Оформление или повышение подписки
      tags:
      - subscriptions
  /profile/me/donations/received:
    get:
      description: Возвращает список донатов, полученных авторизованным пользователем
        (если он является автором), страницами. Чтобы получить следующую страницу,
        передайте next_cursor из ответа в параметр cursor; значение null означает,
        что страниц больше нет.
      parameters:
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.DonationPageResponse'
          description: Страница донатов
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Мои полученные донаты
      tags:
      - donations
  /profile/me/donations/sent:
    get:
      description: Возвращает список донатов, отправленных авторизованным пользователем,
        страницами. Чтобы получить следующую страницу, передайте next_cursor из ответа
        в параметр cursor; значение null означает, что страниц больше нет.
      parameters:
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.DonationPageResponse'
          description: Страница донатов
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Мои отправленные донаты
      tags:
      - donations
  /profile/me/tiers:
    get:
      description: Возвращает открытые и архивные уровни текущего автора страницами
        по возрастанию цены и ID. Для следующей страницы передайте next_cursor из
        ответа в параметр cursor.
      parameters:
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.SubscriptionTierListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - CookieAuth: []
      summary: Список уровней подписки автора
      tags:
      - subscriptions
    post:
      description: Создаёт открытый уровень подписки с фиксированной ценой за 30 суток.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.CreateSubscriptionTierRequest'
              description: Данные уровня
              summary: request
        description: Данные уровня
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.SubscriptionTier'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - CookieAuth: []
      summary: Создание уровня подписки
      tags:
      - subscriptions
  /profile/me/tiers/{id}:
    patch:
      description: Изменяет имя, описание и цену уровня либо архивирует его. Цена
        активного уровня не может пересечь цену соседнего уровня.
      parameters:
      - description: ID уровня
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.UpdateSubscriptionTierRequest'
              description: Изменения уровня
              summary: request
        description: Изменения уровня
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.SubscriptionTier'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - CookieAuth: []
      summary: Изменение или архивация уровня подписки
      tags:
      - subscriptions
