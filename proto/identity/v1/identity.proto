syntax = "proto3";

package identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_2_usage_limit_reached/pkg/proto/identity/v1;identityv1";

service IdentityService {
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc GetAuthors(GetAuthorsRequest) returns (GetAuthorsResponse);
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (UserInfo);
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
}

message GetUsersRequest {
  repeated string ids = 1;
}

message GetUsersResponse {
  repeated UserInfo users = 1;
}

message GetAuthorsRequest {
  repeated string ids = 1;
}

message GetAuthorsResponse {
  repeated Author authors = 1;
}

message GetUserByUsernameRequest {
  string username = 1;
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  string user_id = 1;
  string role = 2;
}

message UserInfo {
  string id = 1;
  string username = 2;
  string nickname = 3;
  string avatar_url = 4;
  google.protobuf.Timestamp created_at = 5;
  string status = 6;
}

message Author {
  string id = 1;
  string bio = 2;
  optional string category = 3;
}
