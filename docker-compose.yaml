services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    restart: unless-stopped
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=patreon
      - POSTGRES_PASSWORD=patreon 
      - POSTGRES_DB=patreon
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: