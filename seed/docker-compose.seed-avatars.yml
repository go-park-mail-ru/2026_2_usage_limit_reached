# Дополнительный compose-файл: подключается поверх боевого docker-compose.yaml и не меняет его.
# Запуск (из корня репозитория):
#   docker compose -f docker-compose.yaml -f seed/docker-compose.seed-avatars.yml run --rm seed-avatars
# Сервис seaweedfs берётся из боевого файла, поэтому оба файла нужны вместе.
#
# Файлы лежат в seed/avatars, ключи в S3 фиксированные: avatars/seed/<username>.png.
# Сервис одноразовый и идемпотентный: aws s3 cp перезаписывает объекты с тем же ключом.
#
# Образ задаётся переменной AWS_CLI_IMAGE, например AWS_CLI_IMAGE=amazon/aws-cli:2.17.0
services:
  seed-avatars:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:2.17.0}
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-media}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./seed/avatars:/avatars:ro
    entrypoint: >
      /bin/sh -c "
      aws configure set default.s3.addressing_style path;
      until aws --endpoint-url $$S3_ENDPOINT s3 ls s3://$$S3_BUCKET/ >/dev/null; do sleep 1; done;
      aws --endpoint-url $$S3_ENDPOINT s3 cp --recursive /avatars/ s3://$$S3_BUCKET/avatars/seed/"
    restart: "no"
