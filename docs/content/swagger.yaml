components:
  schemas:
    dto.AuthorResponse:
      properties:
        avatar_url:
          example: avatars/user-1.png
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.CreatePostResponse:
      properties:
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
      type: object
    dto.PostInfo:
      properties:
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
        body:
          example: Текст поста
          type: string
        created_at:
          example: "2026-09-01T11:00:00Z"
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
        liked_by_user:
          example: true
          type: boolean
        likes_count:
          example: 12
          type: integer
        locked:
          example: false
          type: boolean
        published_at:
          example: "2026-09-01T12:00:00Z"
          type: string
        status:
          example: published
          type: string
        title:
          example: Мой первый пост
          type: string
        updated_at:
          example: "2026-09-01T12:00:00Z"
          type: string
      type: object
    dto.PostLikeResponse:
      properties:
        liked_by_user:
          example: true
          type: boolean
        likes_count:
          example: 13
          type: integer
      type: object
    dto.PostPreview:
      properties:
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
        body_preview:
          example: Первые 200 символов текста поста
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
        liked_by_user:
          example: true
          type: boolean
        likes_count:
          example: 12
          type: integer
        locked:
          example: false
          type: boolean
        published_or_updated_at:
          example: "2026-09-01T12:00:00Z"
          type: string
        title:
          example: Мой первый пост
          type: string
      type: object
    dto.PostRequest:
      properties:
        body:
          example: Текст поста
          type: string
        last_updated_at:
          example: "2026-11-02T12:00:00Z"
          type: string
        status:
          enum:
          - draft
          - published
          example: published
          type: string
        title:
          example: Мой первый пост
          type: string
      type: object
    dto.PostsPageResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/dto.PostPreview'
          type: array
          uniqueItems: false
        next_cursor:
          example: eyJraW5kIjoibmV3X3Bvc3RzIn0
          type: string
      type: object
    response.ErrorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    CookieAuth:
      in: cookie
      name: __Host-token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: Посты, лайки и комментарии.
  title: Patreon Clone Content API
  version: "1.0"
openapi: 3.1.0
paths:
  /feed:
    get:
      description: 'Возвращает опубликованные посты страницами. Авторизация необязательна:
        для авторизованного пользователя заполняется liked_by_user. У закрытых постов
        (locked = true) body_preview пустой. Чтобы получить следующую страницу, передайте
        next_cursor из ответа в параметр cursor; значение null означает, что страниц
        больше нет.'
      parameters:
      - description: Порядок сортировки
        in: query
        name: sort
        required: true
        schema:
          enum:
          - new
          - old
          - popular
          type: string
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostsPageResponse'
          description: Страница постов
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный sort или cursor
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Лента постов
      tags:
      - posts
  /posts:
    post:
      description: Создаёт пост от имени текущего пользователя. Создавать посты могут
        только авторы. Поле last_updated_at при создании не используется. Для статуса
        published дата публикации проставляется автоматически.
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.PostRequest'
              description: Данные поста
              summary: request
        description: Данные поста
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CreatePostResponse'
          description: ID созданного поста
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не является автором, либо неверный CSRF-токен
            или его отсутствие
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Создание поста
      tags:
      - posts
  /posts/{id}:
    delete:
      description: Удаляет пост текущего пользователя вместе с лайками, комментариями
        и уведомлениями.
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Пост удалён
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный CSRF-токен или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или принадлежит другому пользователю
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Удаление поста
      tags:
      - posts
    get:
      description: 'Возвращает пост целиком. Авторизация необязательна: автор видит
        свои неопубликованные посты, для остальных они недоступны (404). У закрытого
        поста (locked = true) поле body пустое.'
      parameters:
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostInfo'
          description: Пост
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или недоступен
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Просмотр поста
      tags:
      - posts
    put:
      description: 'Полностью заменяет title, body и status поста. Используется оптимистическая
        блокировка: в last_updated_at нужно передать значение updated_at, полученное
        при последнем чтении поста. Если пост успели изменить, вернётся 409, и пост
        нужно перечитать.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.PostRequest'
              description: Новые данные поста (last_updated_at обязателен)
              summary: request
        description: Новые данные поста (last_updated_at обязателен)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Пост обновлён
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации или не передан last_updated_at
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост принадлежит другому пользователю, либо неверный CSRF-токен
            или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или недоступен
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост уже был изменён (устаревший last_updated_at)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Изменение поста
      tags:
      - posts
  /posts/{id}/like:
    delete:
      description: 'Снимает лайк пользователя с поста. Операция идемпотентна: если
        лайка нет, счётчик не меняется.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostLikeResponse'
          description: Актуальное число лайков
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный CSRF-токен или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Лайк не найден или пост недоступен
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Снятие лайка с поста
      tags:
      - posts
    post:
      description: 'Ставит лайк опубликованному посту. Операция идемпотентна: повторный
        лайк не увеличивает счётчик. Лайкнуть можно только пост, доступный пользователю;
        автору о лайке своего поста уведомление не отправляется.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostLikeResponse'
          description: Актуальное число лайков
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный CSRF-токен или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или недоступен
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Лайк поста
      tags:
      - posts
  /profile/me/drafts:
    get:
      description: Возвращает черновики авторизованного пользователя страницами. Поддерживается
        только sort=new.
      parameters:
      - description: Порядок сортировки (поддерживается только new)
        in: query
        name: sort
        required: true
        schema:
          enum:
          - new
          type: string
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostsPageResponse'
          description: Страница черновиков
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный sort или cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Черновики текущего пользователя
      tags:
      - posts
  /profile/me/posts:
    get:
      description: Возвращает опубликованные посты авторизованного пользователя страницами.
        Черновики доступны через /profile/me/drafts.
      parameters:
      - description: Порядок сортировки
        in: query
        name: sort
        required: true
        schema:
          enum:
          - new
          - popular
          type: string
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostsPageResponse'
          description: Страница постов
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный sort или cursor
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Посты текущего пользователя
      tags:
      - posts
  /users/{username}/posts:
    get:
      description: 'Возвращает опубликованные автора посты страницами. Авторизация
        необязательна: для авторизованного пользователя заполняется liked_by_user.
        У закрытых постов (locked = true) body_preview пустой. Чтобы получить следующую
        страницу, передайте next_cursor из ответа в параметр cursor; значение null
        означает, что страниц больше нет.'
      parameters:
      - description: Порядок сортировки
        in: query
        name: sort
        required: true
        schema:
          enum:
          - new
          - old
          - popular
          type: string
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostsPageResponse'
          description: Страница постов
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный sort или cursor
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Лента постов автора
      tags:
      - posts
