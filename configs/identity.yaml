http:
  port: "8081"
  read_header_timeout: 5s
  shutdown_timeout: 5s

grpc:
  port: "50051"
  shutdown_timeout: 5s

postgres:
  host: postgres
  port: 5432
  sslmode: disable
  min_conns: 0
  max_conns: 10
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

s3:
  public_path: /media

log:
  level: debug
  format: text

jwt:
  secret: dev-secret-string-with-at-least-32-symbols

csrf:
  secret: dev-csrf-secret-string-with-at-least-32-symbols

cors:
  allowed_origins:
    - http://localhost:3000
