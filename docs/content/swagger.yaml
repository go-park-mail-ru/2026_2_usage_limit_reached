components:
  schemas:
    dto.Attachment:
      properties:
        id:
          example: 00000000-0000-4000-8000-000000000301
          type: string
        media_type:
          $ref: '#/components/schemas/dto.AttachmentType'
          example: image
        mime_type:
          example: image/jpeg
          type: string
        name:
          example: Студия.jpg
          type: string
        size_bytes:
          example: 430080
          type: integer
        url:
          example: /attachments/00000000-0000-4000-8000-000000000301
          type: string
      type: object
    dto.AttachmentType:
      enum:
      - image
      - video
      - audio
      - file
      type: string
      x-enum-varnames:
      - AttachmentTypeImage
      - AttachmentTypeVideo
      - AttachmentTypeAudio
      - AttachmentTypeFile
    dto.AuthorResponse:
      properties:
        avatar_url:
          example: avatars/user-1.png
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.CreateDonationRequest:
      properties:
        amount_minor:
          type: integer
        currency:
          type: string
        is_anonymous:
          type: boolean
        message:
          type: string
        request_key:
          type: string
      type: object
    dto.CreateDonationResponse:
      properties:
        id:
          type: string
        status:
          type: string
      type: object
    dto.CreatePostResponse:
      properties:
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
      type: object
    dto.DonationPageResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/dto.GetDonationResponse'
          type: array
          uniqueItems: false
        next_cursor:
          type: string
      type: object
    dto.DonationUserInfo:
      properties:
        avatar_url:
          type: string
        nickname:
          type: string
        username:
          type: string
      type: object
    dto.GetDonationResponse:
      properties:
        amount_minor:
          type: integer
        created_or_paid_at:
          type: string
        currency:
          type: string
        id:
          type: string
        is_anonymous:
          type: boolean
        message:
          type: string
        status:
          type: string
        user:
          $ref: '#/components/schemas/dto.DonationUserInfo'
      type: object
    dto.PostInfo:
      properties:
        attachments:
          description: Attachments — вложения в порядке позиций в body; пустой срез,
            если вложений нет или пост закрыт.
          items:
            $ref: '#/components/schemas/dto.Attachment'
          type: array
          uniqueItems: false
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
        body:
          example: Текст поста
          type: string
        created_at:
          example: "2026-09-01T11:00:00Z"
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
        liked_by_user:
          example: true
          type: boolean
        likes_count:
          example: 12
          type: integer
        locked:
          example: false
          type: boolean
        published_at:
          example: "2026-09-01T12:00:00Z"
          type: string
        status:
          example: published
          type: string
        title:
          example: Мой первый пост
          type: string
        updated_at:
          example: "2026-09-01T12:00:00Z"
          type: string
      type: object
    dto.PostLikeResponse:
      properties:
        liked_by_user:
          example: true
          type: boolean
        likes_count:
          example: 13
          type: integer
      type: object
    dto.PostPreview:
      properties:
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
        body_preview:
          example: Первые 200 символов текста поста
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000101
          type: string
        liked_by_user:
          example: true
          type: boolean
        likes_count:
          example: 12
          type: integer
        locked:
          example: false
          type: boolean
        published_or_updated_at:
          example: "2026-09-01T12:00:00Z"
          type: string
        title:
          example: Мой первый пост
          type: string
      type: object
    dto.PostRequest:
      properties:
        body:
          example: Текст поста
          type: string
        last_updated_at:
          example: "2026-11-02T12:00:00Z"
          type: string
        status:
          enum:
          - draft
          - published
          example: published
          type: string
        title:
          example: Мой первый пост
          type: string
      type: object
    dto.PostsPageResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/dto.PostPreview'
          type: array
          uniqueItems: false
        next_cursor:
          example: eyJraW5kIjoibmV3X3Bvc3RzIn0
          type: string
      type: object
    response.ErrorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    CookieAuth:
      in: cookie
      name: __Host-token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: Ленты, посты и донаты.
  title: Patreon Clone Content API
  version: "1.0"
openapi: 3.1.0
paths:
  /attachments:
    post:
      description: 'Принимает файл в поле file multipart/form-data. Файл сохраняется
        в S3 и реестре media; ответ содержит id для маркера <figure data-attachment-id="...">.
        Тип определяется по содержимому: изображения jpeg/png/webp до 25 МиБ; видео
        mp4 (кодеки H.264, аудио AAC при наличии) до 1 ГиБ; аудио mp3 до 100 МиБ;
        файлы pdf и zip-семейство (docx, pptx, xlsx, zip) до 100 МиБ. Загружать могут
        только авторы.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: Файл вложения
                  format: binary
                  type: string
              required:
              - file
              type: object
        description: Файл вложения
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.Attachment'
          description: Вложение загружено
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Запрос не multipart/form-data, нет поля file, пустое имя файла,
            или превышен лимит непривязанных файлов
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не является автором, либо неверный CSRF-токен
            или его отсутствие
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Файл больше лимита для своего типа
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неподдерживаемый формат или кодек
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Загрузка вложения поста
      tags:
      - posts
  /attachments/{id}:
    get:
      description: Отдаёт файл вложения. Файл доступен автору, а также всем, кому
        доступен опубликованный пост с этим вложением. Для закрытых постов и непривязанных
        файлов остальным возвращается 404. Поддерживаются Range (206) и HEAD.
      parameters:
      - description: ID вложения
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: Диапазон байт
        in: header
        name: Range
        schema:
          type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                type: file
          description: Файл
        "206":
          content:
            application/octet-stream:
              schema:
                type: file
          description: Часть файла
        "400":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID вложения
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Вложение не найдено или недоступно
        "416":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Диапазон вне файла
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Выдача вложения
      tags:
      - posts
  /authors/{author_id}/donations:
    post:
      description: Отправляет донат указанному автору. Операция создаёт платёжную
        попытку, заказ и возвращает ID и статус заказа.
      parameters:
      - description: ID автора
        in: path
        name: author_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.CreateDonationRequest'
              description: Данные доната
              summary: request
        description: Данные доната
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CreateDonationResponse'
          description: Заказ создан
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации или некорректный ID автора
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Автор не найден
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Конфликт оплаты
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Отправка доната
      tags:
      - donations
  /feed:
    get:
      description: 'Возвращает опубликованные посты страницами. Авторизация необязательна:
        для авторизованного пользователя заполняется liked_by_user. У закрытых постов
        (locked = true) body_preview пустой. Чтобы получить следующую страницу, передайте
        next_cursor из ответа в параметр cursor; значение null означает, что страниц
        больше нет.'
      parameters:
      - description: Порядок сортировки
        in: query
        name: sort
        required: true
        schema:
          enum:
          - new
          - old
          - popular
          type: string
      - description: Размер страницы (значения вне диапазона 1-50 заменяются на 20)
        in: query
        name: limit
        schema:
          default: 20
          maximum: 50
          minimum: 1
          type: integer
      - description: Курсор из next_cursor предыдущего ответа (для первой страницы
          не передаётся)
        in: query
        name: cursor
        schema:
          type: string
      - description: Поиск по заголовку и видимому тексту поста
        in: query
        name: q
        schema:
          type: string
      - description: Тема автора
        in: query
        name: tag
        schema:
          enum:
          - Творчество
          - Образование
          - Технологии
          - Игры
          - Другое
          type: string
      - description: Тип вложения
        in: query
        name: attachment_type
        schema:
          enum:
          - any
          - video
          - image
          - audio
          - file
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostsPageResponse'
          description: Страница постов
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный sort, cursor, tag или attachment_type
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Лента постов
      tags:
      - posts
  /posts:
    post:
      description: Создаёт пост от имени текущего пользователя. Создавать посты могут
        только авторы. Поле last_updated_at при создании не используется. Для статуса
        published дата публикации проставляется автоматически.
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.PostRequest'
              description: Данные поста
              summary: request
        description: Данные поста
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.CreatePostResponse'
          description: ID созданного поста
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не является автором, либо неверный CSRF-токен
            или его отсутствие
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Создание поста
      tags:
      - posts
  /posts/{id}:
    delete:
      description: Удаляет пост текущего пользователя вместе с лайками, комментариями
        и уведомлениями.
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Пост удалён
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный CSRF-токен или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или принадлежит другому пользователю
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Удаление поста
      tags:
      - posts
    get:
      description: 'Возвращает пост целиком. Авторизация необязательна: автор видит
        свои неопубликованные посты, для остальных они недоступны (404). У закрытого
        поста (locked = true) поле body пустое.'
      parameters:
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostInfo'
          description: Пост
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или недоступен
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Просмотр поста
      tags:
      - posts
    put:
      description: 'Полностью заменяет title, body и status поста. Используется оптимистическая
        блокировка: в last_updated_at нужно передать значение updated_at, полученное
        при последнем чтении поста. Если пост успели изменить, вернётся 409, и пост
        нужно перечитать.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.PostRequest'
              description: Новые данные поста (last_updated_at обязателен)
              summary: request
        description: Новые данные поста (last_updated_at обязателен)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Пост обновлён
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации или не передан last_updated_at
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост принадлежит другому пользователю, либо неверный CSRF-токен
            или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или недоступен
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост уже был изменён (устаревший last_updated_at)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Изменение поста
      tags:
      - posts
  /posts/{id}/like:
    delete:
      description: 'Снимает лайк пользователя с поста. Операция идемпотентна: если
        лайка нет, счётчик не меняется.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostLikeResponse'
          description: Актуальное число лайков
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный CSRF-токен или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Лайк не найден или пост недоступен
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Снятие лайка с поста
      tags:
      - posts
    post:
      description: 'Ставит лайк опубликованному посту. Операция идемпотентна: повторный
        лайк не увеличивает счётчик. Лайкнуть можно только пост, доступный пользователю;
        автору о лайке своего поста уведомление не отправляется.'
      parameters:
      - description: CSRF-токен из GET /csrf
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID поста
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PostLikeResponse'
          description: Актуальное число лайков
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Некорректный ID поста
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный CSRF-токен или его отсутствие
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пост не найден или недоступен
