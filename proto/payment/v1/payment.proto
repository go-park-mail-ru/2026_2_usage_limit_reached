syntax = "proto3";

package payment.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_2_usage_limit_reached/pkg/proto/payment/v1;paymentv1";

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentOrder);
  rpc GetPayments(GetPaymentsRequest) returns (GetPaymentsResponse);
  rpc Pay(PayRequest) returns (PayResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (PaymentOrder);
}

message PayRequest {
    string payment_order_id = 1;
}

message PayResponse {
    string status = 1;
}

message CreatePaymentRequest {
  string payer_id = 1;
  string request_key = 2;
  string purpose = 3;
  string origin = 4;
  int64 amount_minor = 5;
  string currency = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message GetPaymentsRequest {
  repeated string payment_order_ids = 1;
}

message GetPaymentsResponse {
  repeated PaymentOrder orders = 1;
}

message PaymentOrder {
  string id = 1;
  string payer_id = 2;
  string purpose = 3;
  string origin = 4;
  int64 expected_amount_minor = 5;
  string currency = 6;
  string status = 7;
  optional string credited_attempt_id = 8;
  google.protobuf.Timestamp paid_at = 9;
  google.protobuf.Timestamp canceled_at = 10;
}

message CancelPaymentRequest {
    string payment_order_id = 1;
}