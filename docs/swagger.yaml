components:
  schemas:
    dto.AuthorResponse:
      properties:
        bio:
          example: i am author
          type: string
        category:
          description: null, если категории нет
          example: Cars
          type: string
      type: object
    dto.LoginRequest:
      properties:
        login:
          description: Email или username пользователя
          example: username123
          type: string
        password:
          example: secret_password_123
          type: string
      type: object
    dto.ProfileResponse:
      properties:
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
          description: Нет, если пользователь не автор
        user:
          $ref: '#/components/schemas/dto.ProfileUserResponse'
      type: object
    dto.ProfileUserResponse:
      properties:
        avatar_url:
          description: Нет, если аватара нет
          example: http://localhost:8333/media/avatars/00000000-0000-4000-8000-000000000001/00000000-0000-4000-8000-000000000201.png
          type: string
        created_at:
          example: "2026-08-01T12:00:00Z"
          type: string
        email:
          example: user@example.com
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.PublicProfileResponse:
      properties:
        author:
          $ref: '#/components/schemas/dto.AuthorResponse'
          description: Нет, если пользователь не автор
        user:
          $ref: '#/components/schemas/dto.PublicProfileUserResponse'
      type: object
    dto.PublicProfileUserResponse:
      properties:
        avatar_url:
          description: Нет, если аватара нет
          example: http://localhost:8333/media/avatars/00000000-0000-4000-8000-000000000001/00000000-0000-4000-8000-000000000201.png
          type: string
        created_at:
          example: "2026-08-01T12:00:00Z"
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.RegistrationRequest:
      properties:
        email:
          example: user@example.com
          type: string
        nickname:
          example: nickname_123
          type: string
        password:
          example: secret_password_123
          type: string
        username:
          example: username123
          type: string
      type: object
    dto.UpdateAuthorRequest:
      properties:
        bio:
          example: i am author
          type: string
        category:
          example: Cars
          type: string
      type: object
    dto.UpdateProfileRequest:
      properties:
        author:
          $ref: '#/components/schemas/dto.UpdateAuthorRequest'
          description: Отправляет только автор. Если блока нет, данные автора не меняются
        nickname:
          example: nickname_123
          type: string
      type: object
    dto.UserResponse:
      properties:
        avatar_url:
          example: http://localhost:8333/media/avatars/00000000-0000-4000-8000-000000000001/00000000-0000-4000-8000-000000000201.png
          type: string
        nickname:
          example: nickname_123
          type: string
        username:
          example: username123
          type: string
      type: object
    response.ErrorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    CookieAuth:
      in: cookie
      name: token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: API для Patreon Clone
  title: Patreon Clone API
  version: "1.0"
openapi: 3.1.0
paths:
  /login:
    post:
      description: Принимает учетные данные, проверяет их и выпускает токен
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.LoginRequest'
              description: Учетные данные пользователя
              summary: request
        description: Учетные данные пользователя
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.UserResponse'
          description: Успешная аутентификация
          headers:
            Set-Cookie:
              description: token=JWT_TOKEN; Path=/; HttpOnly; SameSite=Lax
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Неверный логин или пароль, либо аккаунт неактивен
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Аутентификация пользователя
      tags:
      - auth
  /logout:
    post:
      description: Удаляет авторизационную cookie с токеном
      responses:
        "200":
          description: Успешный выход из системы
          headers:
            Set-Cookie:
              description: token=; Path=/; Max-Age=-1
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
      security:
      - CookieAuth: []
      summary: Деавторизация пользователя
      tags:
      - auth
  /profile/{username}:
    get:
      description: Возвращает публичные данные пользователя без email. Блок author
        есть только у автора, avatar_url - только при наличии аватара
      parameters:
      - description: Username пользователя
        in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.PublicProfileResponse'
          description: Публичный профиль пользователя
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не найден, заблокирован или удалён
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Получение публичного профиля пользователя
      tags:
      - profile
  /profile/me:
    get:
      description: Возвращает данные пользователя. Блок author есть только у автора,
        avatar_url - только при наличии аватара
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ProfileResponse'
          description: Профиль пользователя
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь заблокирован или удалён
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не найден
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Получение профиля текущего пользователя
      tags:
      - profile
    put:
      description: Сохраняет nickname и, если передан блок author, bio и category.
        Если category нет или она null, категория очищается
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.UpdateProfileRequest'
              description: Новые данные профиля
              summary: request
        description: Новые данные профиля
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.ProfileResponse'
          description: Профиль изменен
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь неавторизован
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не является автором, заблокирован или удалён
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Пользователь не найден
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      security:
      - CookieAuth: []
      summary: Изменение профиля текущего пользователя
      tags:
      - profile
  /signup:
    post:
      description: Принимает регистрационные данные, валидирует и создает новый аккаунт
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dto.RegistrationRequest'
              description: Данные нового пользователя
              summary: request
        description: Данные нового пользователя
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dto.UserResponse'
          description: Пользователь успешно зарегистрирован
          headers:
            Set-Cookie:
              description: token=JWT_TOKEN; Path=/; HttpOnly; SameSite=Lax
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Ошибка валидации
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: 'Ошибка регистрации: пользователь с таким email / username
            уже существует'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Внутренняя ошибка сервера
      summary: Регистрация пользователя
      tags:
      - auth
